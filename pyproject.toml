[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "litscan"
version = "1.1.0"
description = "Academic literature multi-database search tool with CLI and FastAPI web UI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "LPK3215", email = "17538703215@163.com" },
]
keywords = ["academic", "literature", "search", "arxiv", "crossref", "semantic-scholar"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "requests>=2.31.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/LPK3215/LitScan"
Repository = "https://github.com/LPK3215/LitScan"
Changelog = "https://github.com/LPK3215/LitScan/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["core", "server"]
