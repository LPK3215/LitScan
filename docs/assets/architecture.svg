<g><rect x="611" y="470" width="172" height="46" rx="8" fill="#141d36" stroke="#2a3a5f"/><text x="697" y="497" text-anchor="middle" font-size="12" fill="#c6d4f0">Crossref</text></g>
<g><rect x="805" y="470" width="172" height="46" rx="8" fill="#141d36" stroke="#2a3a5f"/><text x="891" y="497" text-anchor="middle" font-size="12" fill="#c6d4f0">OpenReview</text></g>
<g><rect x="223" y="534" width="172" height="46" rx="8" fill="#141d36" stroke="#2a3a5f"/><text x="309" y="561" text-anchor="middle" font-size="12" fill="#c6d4f0">OpenAIRE</text></g>
<g><rect x="417" y="534" width="172" height="46" rx="8" fill="#141d36" stroke="#2a3a5f"/><text x="503" y="561" text-anchor="middle" font-size="12" fill="#c6d4f0">DOAJ</text></g>
<g><rect x="611" y="534" width="172" height="46" rx="8" fill="#141d36" stroke="#2a3a5f"/><text x="697" y="561" text-anchor="middle" font-size="12" fill="#c6d4f0">Europe PMC <tspan fill="#e8b34b" font-size="9"> (opt)</tspan></text></g>

  <!-- outputs row -->
  <line x1="600" y1="580" x2="600" y2="668" stroke="#5b9dff" stroke-width="1.6" marker-end="url(#ah)" stroke-dasharray="5,4"/>
  
  <rect x="105" y="668" width="220" height="58" rx="10" fill="#12182b" stroke="#24406e" stroke-width="1.2"/>
  <text x="215" y="701" text-anchor="middle" font-size="15" font-weight="700" fill="#f0f4ff">articles.csv</text>
  <text x="215" y="719" text-anchor="middle" font-size="11" fill="#8b9cc0"><tspan x="215" dy="0">统一格式结果</tspan></text>
  
  <rect x="355" y="668" width="220" height="58" rx="10" fill="#12182b" stroke="#24406e" stroke-width="1.2"/>
  <text x="465" y="701" text-anchor="middle" font-size="15" font-weight="700" fill="#f0f4ff">log.md</text>
  <text x="465" y="719" text-anchor="middle" font-size="11" fill="#8b9cc0"><tspan x="465" dy="0">检索日志</tspan></text>
  
  <rect x="605" y="668" width="220" height="58" rx="10" fill="#12182b" stroke="#24406e" stroke-width="1.2"/>
  <text x="715" y="701" text-anchor="middle" font-size="15" font-weight="700" fill="#f0f4ff">history.json</text>
  <text x="715" y="719" text-anchor="middle" font-size="11" fill="#8b9cc0"><tspan x="715" dy="0">搜索历史 (max 200)</tspan></text>
  
  <rect x="855" y="668" width="220" height="58" rx="10" fill="#12182b" stroke="#24406e" stroke-width="1.2"/>
  <text x="965" y="701" text-anchor="middle" font-size="15" font-weight="700" fill="#f0f4ff">out/raw/</text>
