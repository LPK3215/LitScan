  <text x="255" y="357" text-anchor="middle" font-size="15" font-weight="700" fill="#f0f4ff">Scanner</text>
  <text x="255" y="375" text-anchor="middle" font-size="11" fill="#8b9cc0"><tspan x="255" dy="0">core/scanner.py · orchestration</tspan></text>
  
