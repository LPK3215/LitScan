  <rect x="330" y="206" width="540" height="70" rx="10" fill="#182647" stroke="#34508c" stroke-width="1.2"/>
  <text x="600" y="245" text-anchor="middle" font-size="15" font-weight="700" fill="#f0f4ff">FastAPI Server</text>
  <text x="600" y="263" text-anchor="middle" font-size="11" fill="#8b9cc0"><tspan x="600" dy="0">server/main.py · routes &amp; templates · Pydantic models</tspan></text>

  <line x1="600" y1="276" x2="600" y2="316" stroke="#5b9dff" stroke-width="1.6" marker-end="url(#ah)"/>

