  <text x="945" y="375" text-anchor="middle" font-size="11" fill="#8b9cc0"><tspan x="945" dy="0">core/history.py · core/logger.py</tspan></text>

  <line x1="255" y1="390" x2="500" y2="434" stroke="#5b9dff" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="600" y1="390" x2="600" y2="434" stroke="#5b9dff" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="945" y1="390" x2="700" y2="434" stroke="#5b9dff" stroke-width="1.6" marker-end="url(#ah)"/>

