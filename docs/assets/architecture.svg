  <text x="600" y="357" text-anchor="middle" font-size="15" font-weight="700" fill="#f0f4ff">Fetcher</text>
  <text x="600" y="375" text-anchor="middle" font-size="11" fill="#8b9cc0"><tspan x="600" dy="0">core/fetcher.py · retry x4 · proxy · timeout=45s</tspan></text>
  
  <rect x="795" y="316" width="300" height="74" rx="10" fill="#182647" stroke="#34508c" stroke-width="1.2"/>
