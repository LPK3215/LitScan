<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LitScan{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/">LitScan</a>
            <span class="nav-version">v0.1</span>
        </div>
        <div class="nav-links">
            <a href="/" class="{% if active_page == 'search' %}active{% endif %}">检索</a>
            <a href="/history" class="{% if active_page == 'history' %}active{% endif %}">历史</a>
            <a href="/logs" class="{% if active_page == 'logs' %}active{% endif %}">日志</a>
            <a href="/sources" class="{% if active_page == 'sources' %}active{% endif %}">数据源</a>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <span>LitScan - 学术文献检索工具</span>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
