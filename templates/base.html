<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LitScan{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔭</text></svg>">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>LitScan</a>
            <span class="nav-version">v1.1.0</span>
        </div>
        <div class="nav-links">
            <a href="/" class="{% if active_page == 'search' %}active{% endif %}">检索</a>
            <a href="/history" class="{% if active_page == 'history' %}active{% endif %}">历史</a>
            <a href="/logs" class="{% if active_page == 'logs' %}active{% endif %}">日志</a>
            <a href="/sources" class="{% if active_page == 'sources' %}active{% endif %}">数据源</a>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <span>LitScan · 学术文献多库检索工具 · <a href="https://github.com/LPK3215/LitScan" target="_blank" rel="noopener">GitHub</a></span>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
